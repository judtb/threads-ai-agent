name: Threads AI Agent

on:
  schedule:
    # Jalan otomatis setiap 6 jam sekali (jam 00:00, 06:00, 12:00, 18:00 UTC)
    - cron: '0 */6 * * *'
  workflow_dispatch: # Ini biar lu bisa nge-test jalanin manual tanpa nunggu 6 jam

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Ambil Kode dari Repo
        uses: actions/checkout@v4
        
      - name: Siapin Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Install Library
        run: pip install -r requirements.txt
        
      - name: Jalanin Robot AI
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
        run: python main.py
